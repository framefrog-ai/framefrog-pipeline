# FrameFrog pipeline — serverless GPU deployment config.
# Cerebrium's config schema changes between CLI releases; verify against
# https://docs.cerebrium.ai/ before deploying, then run:
#   cerebrium deploy
#
# Two deployment shapes work:
#   * HTTP API     entrypoint = "framefrog.api:app"      (FastAPI)
#   * job worker   entrypoint = "main:post_production"   (function)

[cerebrium.deployment]
name = "framefrog-pipeline"
python_version = "3.11"
entrypoint = "main:post_production"
webhook = true

[build]
requirements = "requirements.txt"
system_packages = ["ffmpeg"]
