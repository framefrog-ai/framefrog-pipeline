name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python 3.11, FFmpeg)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-models.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show toolchain
        run: |
          python --version
          ffmpeg -version | head -n 1
          pytest --version

      - name: Compile check
        run: python -m compileall -q framefrog main.py demo.py scripts

      - name: Run tests
        shell: bash
        env:
          # Models are not fetched in CI: RIFE tests detect an empty model dir
          # and skip, while the FFmpeg fallbacks still run for real.
          FRAMEFROG_MODEL_DIR: ${{ runner.temp }}/framefrog-models
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee pytest.log

      - name: Publish pytest output on failure
        if: failure()
        run: |
          {
            echo '## pytest output (tail)'
            echo '```'
            tail -n 80 pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
