name: CI

# One run per change:
#   * a push to a branch with an open PR triggers the pull_request event;
#   * a push to main triggers the push event;
#   * the workflow can also be started by hand.
# Listing the branch under `push` as well used to run the whole workflow
# twice for every push.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: lint (ruff, mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.6" "mypy>=1.10"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: MyPy
        run: mypy app

  test:
    name: pytest (Python 3.11, FFmpeg, CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Show toolchain
        run: |
          python --version
          ffmpeg -version | head -n 1
          pytest --version

      - name: Verify SPDX headers and license
        run: python scripts/check_spdx.py

      - name: Check the environment
        run: python scripts/check_environment.py

      - name: Run the CPU test suite
        shell: bash
        env:
          # Models are not fetched in CI: the RIFE tests detect an empty model
          # directory and skip, while the FFmpeg fallbacks still run for real.
          MODEL_CACHE_DIR: ${{ runner.temp }}/framefrog-models
        run: |
          set -o pipefail
          python -m pytest -m "not gpu" -v 2>&1 | tee pytest.log

      - name: Publish pytest output on failure
        if: failure()
        run: |
          {
            echo '## pytest output (tail)'
            echo '```'
            tail -n 80 pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import pathlib
          lines = [l.strip() for l in pathlib.Path("pytest.log").read_text(errors="replace").splitlines() if l.strip()]
          tail = " | ".join(lines[-30:])
          print(f"::error::{tail[:3500]}")
          PY

  docker:
    name: docker build (CPU image)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: framefrog-pipeline:cpu
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          # The image defaults to APP_ENV=production, where an API key is
          # mandatory — the check therefore runs in development mode.
          docker run --rm -e APP_ENV=development framefrog-pipeline:cpu python scripts/check_environment.py
          docker run --rm -e APP_ENV=development framefrog-pipeline:cpu python -c "from app.main import create_app; print('app import ok')"

  security:
    name: security (secret scan, dependency audit, container scan)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Secret scan
        # The gitleaks GitHub Action requires a licence key for organisations,
        # so the OSS image is used directly instead.
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks:v8.24.2 \
            detect --source=/repo --no-banner --redact --exit-code 1 \
            --config /repo/.gitleaks.toml

      - name: Dependency audit (pip-audit)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pip-audit
          python - <<'PY' > /tmp/framefrog-requirements.txt
          import tomllib

          data = tomllib.load(open("pyproject.toml", "rb"))
          requirements = list(data["project"]["dependencies"])
          for extra in ("dev", "models", "audio"):
              requirements += data["project"]["optional-dependencies"].get(extra, [])
          print("\n".join(requirements))
          PY
          pip-audit --progress-spinner off -r /tmp/framefrog-requirements.txt

      - name: Build the image for the container scan
        run: docker build -t framefrog-pipeline:cpu .

      - name: Container scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: framefrog-pipeline:cpu
          format: table
          # CRITICAL findings block the build; HIGH findings are reported for
          # review (most of them come from the Debian base image).
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

  spdx:
    name: SPDX and licence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Verify SPDX headers
        run: python scripts/check_spdx.py
